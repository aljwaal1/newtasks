name: Build and Publish Android APK

on:
  push:
    branches:
      - main
      - feature/persistent-reminders-v1.3.3
      - build/v1.3.3
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Lint and build universal debug APK
        shell: bash
        run: |
          set +e
          gradle :app:lintDebug :app:assembleDebug --stacktrace --console=plain > gradle-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "===== ANDROID CHECK FAILURE — LAST 240 LINES ====="
            tail -n 240 gradle-build.log
            exit "$status"
          fi
          echo "===== ANDROID CHECK SUCCESS — LAST 60 LINES ====="
          tail -n 60 gradle-build.log
          cp app/build/outputs/apk/debug/app-debug.apk SmartTasks-1.3.3-Universal.apk
          unzip -t SmartTasks-1.3.3-Universal.apk
          sha256sum SmartTasks-1.3.3-Universal.apk | tee SmartTasks-1.3.3-Universal.apk.sha256

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-tasks-gradle-log-v1.3.3
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-tasks-lint-report-v1.3.3
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smart-tasks-universal-android5plus-v1.3.3
          path: |
            SmartTasks-1.3.3-Universal.apk
            SmartTasks-1.3.3-Universal.apk.sha256

      - name: Publish direct GitHub download
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.3-test
          name: Smart Tasks 1.3.3 Test
          prerelease: true
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            SmartTasks-1.3.3-Universal.apk
            SmartTasks-1.3.3-Universal.apk.sha256
          body: |
            نسخة اختبار من Smart Tasks 1.3.3.
            تضيف «ذكّرني غدًا» واختيار تاريخ ووقت جديد للمهام غير المكتملة.
            تحسن اختيار مسار الصوت عند كون صوت المنبه في الجهاز صامتًا.
            تدعم Android 5.0 فأعلى وأجهزة 32-bit و64-bit.
