name: Build Google Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-play-bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate release secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "Missing ANDROID_STORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          test -n "$ADMOB_APP_ID" || { echo "Missing ADMOB_APP_ID"; exit 1; }
          test -n "$ADMOB_BANNER_ID" || { echo "Missing ADMOB_BANNER_ID"; exit 1; }
          case "$ADMOB_APP_ID" in ca-app-pub-*~*) ;; *) echo "ADMOB_APP_ID has invalid format"; exit 1;; esac
          case "$ADMOB_BANNER_ID" in ca-app-pub-*/*) ;; *) echo "ADMOB_BANNER_ID has invalid format"; exit 1;; esac

      - name: Restore upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore/play-upload.jks
          chmod 600 keystore/play-upload.jks

      - name: Lint and build signed revenue AAB
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/keystore/play-upload.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: |
          set -euo pipefail
          gradle :app:lintRelease :app:bundleRelease --stacktrace --console=plain
          cp app/build/outputs/bundle/release/app-release.aab SmartTasks-1.3.5-Play.aab
          sha256sum SmartTasks-1.3.5-Play.aab > SmartTasks-1.3.5-Play.aab.sha256

      - name: Upload Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: smart-tasks-google-play-v1.3.5-live-ads
          path: |
            SmartTasks-1.3.5-Play.aab
            SmartTasks-1.3.5-Play.aab.sha256
          if-no-files-found: error
          retention-days: 30
