name: Build Google Play AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-play-bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate and normalize signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "Missing ANDROID_STORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

          mkdir -p keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > keystore/play-upload.jks
          chmod 600 keystore/play-upload.jks

          CLEAN_STORE_PASSWORD="$(printf '%s' "$ANDROID_STORE_PASSWORD" | tr -d '\r\n')"
          CLEAN_KEY_ALIAS="$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n')"
          CLEAN_KEY_PASSWORD="$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')"

          keytool -list \
            -keystore keystore/play-upload.jks \
            -storepass "$CLEAN_STORE_PASSWORD" \
            -alias "$CLEAN_KEY_ALIAS" >/dev/null

          {
            echo "CLEAN_ANDROID_STORE_PASSWORD=$CLEAN_STORE_PASSWORD"
            echo "CLEAN_ANDROID_KEY_ALIAS=$CLEAN_KEY_ALIAS"
            echo "CLEAN_ANDROID_KEY_PASSWORD=$CLEAN_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Lint and build signed Play AAB
        shell: bash
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_PATH="${{ github.workspace }}/keystore/play-upload.jks"
          export ANDROID_STORE_PASSWORD="$CLEAN_ANDROID_STORE_PASSWORD"
          export ANDROID_KEY_ALIAS="$CLEAN_ANDROID_KEY_ALIAS"
          export ANDROID_KEY_PASSWORD="$CLEAN_ANDROID_KEY_PASSWORD"

          if [ -n "${ADMOB_APP_ID:-}" ] && [ -n "${ADMOB_BANNER_ID:-}" ]; then
            echo "Building with configured AdMob production IDs."
          else
            echo "AdMob production IDs are not configured; Gradle will use Google's official demo IDs for closed testing."
          fi

          gradle :app:lintRelease :app:bundleRelease --stacktrace --console=plain
          cp app/build/outputs/bundle/release/app-release.aab SmartTasks-1.3.6-Play.aab
          sha256sum SmartTasks-1.3.6-Play.aab > SmartTasks-1.3.6-Play.aab.sha256

          test -s app/build/outputs/mapping/release/mapping.txt || {
            echo "R8 mapping.txt was not generated" >&2
            exit 1
          }
          cp app/build/outputs/mapping/release/mapping.txt SmartTasks-1.3.6-mapping.txt

          unzip -l SmartTasks-1.3.6-Play.aab > SmartTasks-1.3.6-bundle-contents.txt
          grep -q "BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map" SmartTasks-1.3.6-bundle-contents.txt || {
            echo "R8 mapping metadata is missing from the AAB" >&2
            exit 1
          }

          if [ -s app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip ]; then
            cp app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip SmartTasks-1.3.6-native-debug-symbols.zip
          else
            echo "No standalone native-debug-symbols.zip was produced; checking AAB metadata."
          fi

          echo "===== Bundle metadata ====="
          grep "BUNDLE-METADATA" SmartTasks-1.3.6-bundle-contents.txt || true

      - name: Upload Play bundle and debug metadata
        uses: actions/upload-artifact@v4
        with:
          name: smart-tasks-google-play-v1.3.6
          path: |
            SmartTasks-1.3.6-Play.aab
            SmartTasks-1.3.6-Play.aab.sha256
            SmartTasks-1.3.6-mapping.txt
            SmartTasks-1.3.6-native-debug-symbols.zip
            SmartTasks-1.3.6-bundle-contents.txt
          if-no-files-found: warn
          retention-days: 30
